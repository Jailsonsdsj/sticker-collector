name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; never cancel one mid-flight (it could leave prod half-updated).
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gates as ci.yml — never deploy a red build.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Migrate BEFORE deploy (§8, expand-migrate-contract): for the few seconds
      # between this and the deploy, the migration must stay backward-compatible with
      # the currently-live Worker. Never do a destructive rename in one step.
      - name: Apply migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sticker-collector --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy | tee deploy.out

      # Curl the freshly-deployed URL (parsed from the deploy output) so a broken
      # deploy fails the workflow loudly. Public endpoint — no credentials needed.
      - name: Health check
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.out | head -1)
          test -n "$url" || { echo "could not determine deployed URL"; exit 1; }
          echo "Checking $url/api/health"
          curl -fsS "$url/api/health"
