name: CI

on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so node's pnpm store cache can resolve. No `version`:
      # the pinned pnpm comes from package.json's `packageManager` field (single source).
      - uses: pnpm/action-setup@v4

      # Node comes from .nvmrc — the same version developers run locally.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Self-test first: a guard whose grep has been broken exits 0 forever and
      # keeps CI green while drift accumulates. If the guard is dead, that is the
      # error you want to read — not a false pass from the scan below.
      - run: bash scripts/check-tokens.sh --self-test
      - run: pnpm lint:tokens

      - run: pnpm typecheck
      - run: pnpm test

      # Prove every migration (incl. 0002_triggers.sql) applies cleanly from scratch
      # via wrangler's own path — fully local, no Cloudflare credentials. Remote
      # migration/deploy lives in deploy.yml, which is the only place secrets are used.
      - run: npx wrangler d1 migrations apply sticker-collector --local

      - run: pnpm build

      # Bundles + validates the Worker and wrangler.jsonc without deploying. Needs the
      # web build above for the assets binding; needs no authentication.
      - run: npx wrangler deploy --dry-run

  # A separate job, not extra steps on `ci`: the browser download and the
  # wrangler boot are minutes that the fast feedback (lint, types, unit tests)
  # should not wait behind. They fail independently and report independently.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only chromium. The app is an installed PWA on one device, not a
      # cross-browser matrix, and every extra engine is download time on every PR.
      - run: pnpm exec playwright install --with-deps chromium

      # Playwright transpiles rather than typechecks, so a broken e2e type would
      # otherwise surface as a runtime failure with a worse error.
      - run: pnpm typecheck:e2e

      # Seeds local D1 + R2, builds the SPA and boots wrangler — all driven by
      # the webServer block in e2e/playwright.config.ts, so this is the same
      # command a developer runs.
      - run: pnpm e2e
        env:
          CLOUDFLARE_TELEMETRY_DISABLED: "1"

      # Only on failure: the trace and screenshots are the whole point of having
      # run a browser, and uploading them on green is noise.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
